<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" href="images/favicon.png">

    <!--Google Symbols-->
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

    <!--Bootstrap Icons-->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.3/font/bootstrap-icons.css">

    <!--Mapbox GL JS-->
    <script src='https://api.mapbox.com/mapbox-gl-js/v2.9.1/mapbox-gl.js'></script>
    <link href='https://api.mapbox.com/mapbox-gl-js/v2.9.1/mapbox-gl.css' rel='stylesheet' />

    <!--Mapbox GL JS Geocoder-->
    <script
        src="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-geocoder/v5.0.0/mapbox-gl-geocoder.min.js"></script>
    <link rel="stylesheet"
        href="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-geocoder/v5.0.0/mapbox-gl-geocoder.css"
        type="text/css">

    <!--<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.5.0/math.js"
        integrity="sha512-PRRHSwgn8QJinp43y5B698YK/FApqSvwmd7kVu8NWMksCl/3daKnNbPNWPuGKDrpIIb+0Dg5W55VSbZi0QG60Q=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>-->

    <link rel="stylesheet" href="style.css">

    <!--Achtung, die Reihenfolge ist wichtig (Dependencies)-->
    <script src="keys.js" defer></script>
    <script src="DateAndTime.js" defer></script>
    <script src="hashing.js" defer></script>
    <script src="DOMelements.js" defer></script>
    <script src="init-global.js" defer></script>
    <script src="map.js" defer></script>
    <script src="markers.js" defer></script>
    <script src="geocoding.js" defer></script>
    <script src="routing.js" defer></script>
    <script src="weather.js" defer></script>
    <script src="ui.js" defer></script>

    <title>weather.nav</title>

    <style>

    </style>
</head>

<body>

    

    <div id="sidebar">
        <!--JS-->
    </div>

    <!--Contextmenü beim Rechtsklick auf Wegpunkte-->
    <div id="contextmenu" class="contextmenu">
        <!--JS-->
    </div>



    <div id="container">



        <!--Geocoder Input zur Starteingabe-->
        <div id="geocoderStart"></div>
        <input type="datetime-local" value="2023-01-27T19:06" min="2023-01-27T19:06" id="startDateInput">

        <!--Geocoder Inputs für Wegpunkte und Ziel-->
        <div id="geocoders">
            <div id="geocoderExtra"></div>
            <div id="geocoderEnd"></div>
        </div>

        <!--Buttons zum Wechseln des Routing Profiles-->
        <div class="buttonContainer">
            <button id="carButton">Car</button>
            <button id="bikeButton">Bike</button>
            <button id="walkButton">Walking</button>
        </div>

        <!--Hier wird die Zusammenfassung der Route angezeigt-->
        <div id="routeSummary">

            <i onclick="removeStart(); removeEnd(); geoCoder.clear(); geoCoder2.clear()" class="bi bi-trash3-fill"
                style="align-self: flex-end; position: absolute; margin-right: 20px; cursor: pointer" title="delete route"></i>
            <p><b>Route overview</b><br>&nbsp;</p>
            <div id="table">
                <p style="color: gray">duration<br>
                    <b><span style="color: white" id="duration"></span></b><br>&nbsp;
                </p>
                <p style="color: gray">distance<br>
                    <b><span style="color: white" id="length"></span><br>&nbsp;</b>
                </p>
                <p style="color: gray">wind<br>
                    <b><span style="color: white" id="wind"></span></b><br>&nbsp;
                </p>
                <p style="color: gray">temp<br>
                    <b><span style="color: white" id="temp"></span></b><br>&nbsp;
                </p>
            </div>
            <!--Hier kommt das Icon der Significant Condition rein-->
            <div id="conditionSummary">
                <!--JS-->
            </div>
            <div class="container2" onclick="setRouteDetails()">
                <p>see route details <i class="bi bi-arrow-right"></i></p>
            </div>
        </div>

        <!--Div für die Routendetails-->
        <div id="routeDetails">
            <!--JS-->
        </div>

        <!--Chechbox zum Togglen der Popups-->
        <p id="popupToggle"><input id="popupToggleCheckbox" type="checkbox" checked oninput="toggleAllPopups()"> show
            weather popups</p>

        <!--Logo-->
        <div id="logosection">
            <img src="/images/favicon.png" alt="" height="25px">
            <h1>weather.nav</h1>
        </div>

    </div>


    <!--Container am unteren linken Bildschirmrand-->
    <div id="bottomContainer">
        <!--<div id="loaderContainer">
            <img id="loader" src="images/loading.gif" alt="">
            <p>loading route data</p>
        </div>-->

    </div>

    <!--Slider-->
    <div id="sliderContainer">
        <div id="sliderTextAndOverlay">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                class="bi bi-clock-history" viewBox="0 0 16 16">
                <path
                    d="M8.515 1.019A7 7 0 0 0 8 1V0a8 8 0 0 1 .589.022l-.074.997zm2.004.45a7.003 7.003 0 0 0-.985-.299l.219-.976c.383.086.76.2 1.126.342l-.36.933zm1.37.71a7.01 7.01 0 0 0-.439-.27l.493-.87a8.025 8.025 0 0 1 .979.654l-.615.789a6.996 6.996 0 0 0-.418-.302zm1.834 1.79a6.99 6.99 0 0 0-.653-.796l.724-.69c.27.285.52.59.747.91l-.818.576zm.744 1.352a7.08 7.08 0 0 0-.214-.468l.893-.45a7.976 7.976 0 0 1 .45 1.088l-.95.313a7.023 7.023 0 0 0-.179-.483zm.53 2.507a6.991 6.991 0 0 0-.1-1.025l.985-.17c.067.386.106.778.116 1.17l-1 .025zm-.131 1.538c.033-.17.06-.339.081-.51l.993.123a7.957 7.957 0 0 1-.23 1.155l-.964-.267c.046-.165.086-.332.12-.501zm-.952 2.379c.184-.29.346-.594.486-.908l.914.405c-.16.36-.345.706-.555 1.038l-.845-.535zm-.964 1.205c.122-.122.239-.248.35-.378l.758.653a8.073 8.073 0 0 1-.401.432l-.707-.707z" />
                <path d="M8 1a7 7 0 1 0 4.95 11.95l.707.707A8.001 8.001 0 1 1 8 0v1z" />
                <path
                    d="M7.5 3a.5.5 0 0 1 .5.5v5.21l3.248 1.856a.5.5 0 0 1-.496.868l-3.5-2A.5.5 0 0 1 7 9V3.5a.5.5 0 0 1 .5-.5z" />
            </svg>
            <button onclick="prevSignificant()"><i class="bi bi-caret-left-fill"></i></button>
            <p><span id="time"></span></p>
            <button onclick="nextSignificant()"><i class="bi bi-caret-right-fill"></i></button>
            <select name="overlay" id="overlay">
                <option value="rain">Rain</option>
                <option value="wind">Wind</option>
                <option value="snow">Snow</option>
                <option value="temp">Temperature</option>
                <option value="none">none</option>

            </select>
        </div>


        <input type="range" min="0" max="24" value="0" class="slider" id="myRange">

    </div>

    <div id="map">
        <!--Hier kommt die Map rein-->
    </div>





    

</body>

</html>
